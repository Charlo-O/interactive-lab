<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #0e1014;
    --ink: #ffffff;
    --shade: rgb(40 56 84 / .3);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page);
    display: grid;
    place-items: center;
    font-family: Manrope, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    --W: 390px;
    position: relative;
    width: min(100vw, 430px, calc(100dvh * 9 / 19.5));
    aspect-ratio: 9 / 19.5;
    /* 用 clip-path 切圆角：border-radius + overflow:hidden 会干扰内部的 backdrop-filter */
    clip-path: inset(0 round 44px);
    background: #b9c7d8;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  .phone.dragging { cursor: grabbing; }
  @media (max-width: 500px) and (max-aspect-ratio: 5 / 8) {
    .phone { width: 100vw; height: 100dvh; aspect-ratio: auto; clip-path: inset(0); }
  }

  /* 背景和玻璃花瓣都画在这张 WebGL 画布里 */
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- 花瓣上的图标和文字 ---------- */
  .tags { position: absolute; inset: 0; pointer-events: none; }
  .tag {
    --t: 0;
    position: absolute; left: 0; top: 0;
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--W) * .01);
    white-space: nowrap; will-change: transform;
    font-family: Outfit, Manrope, -apple-system, sans-serif;
    font-size: calc(var(--W) * .03); font-weight: 300; letter-spacing: .005em;
    color: rgb(255 255 255 / calc(.74 + .26 * var(--t)));
    text-shadow: 0 1px 10px var(--shade);
  }
  .tag.on { font-weight: 400; text-shadow: 0 1px 12px rgb(40 56 84 / .5), 0 0 2px rgb(40 56 84 / .25); }
  .tag.on svg { filter: drop-shadow(0 1px 5px rgb(40 56 84 / .45)); }
  .tag svg {
    width: calc(var(--W) * .042); height: calc(var(--W) * .042);
    fill: none; stroke: currentColor; stroke-width: 1.15;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 1px 4px var(--shade));
  }
  .tag.on svg { stroke-width: 1.7; }

  /* ---------- 小时刻度 + 环线 ---------- */
  .dial { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .dial .ring { fill: none; stroke: #fff; stroke-opacity: .7; stroke-width: 1.2; }
  .dial .ring-glow { fill: none; stroke: #fff; stroke-opacity: .35; stroke-width: 7; filter: url(#ring-glow); }
  .dial line { stroke: #fff; stroke-linecap: round; }
  .dial text {
    fill: #fff; font-size: calc(var(--W) * .034); font-weight: 500; letter-spacing: .06em;
    text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums;
  }
  .dial text.on { font-weight: 700; }

  /* ---------- 顶部 / 底部 ---------- */
  .top { position: absolute; left: calc(var(--W) * .07); top: calc(var(--W) * .12); text-shadow: 0 1px 10px var(--shade); }
  .brand { font-size: calc(var(--W) * .03); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .readout { margin-top: .5em; font-size: calc(var(--W) * .032); font-weight: 500; letter-spacing: .02em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgb(40 56 84 / .45); }
  .swap { animation: swap .32s cubic-bezier(.2, .9, .25, 1); }
  @keyframes swap { from { opacity: 0; transform: translateY(.25em); } }

  .foot {
    position: absolute; left: calc(var(--W) * .07); right: calc(var(--W) * .07); bottom: calc(var(--W) * .08);
    display: flex; justify-content: flex-end; align-items: center;
  }
  .pill {
    flex: none; font: inherit; color: #fff; font-size: calc(var(--W) * .03); font-weight: 500; letter-spacing: .04em;
    padding: .55em 1.1em; border-radius: 999px; cursor: pointer;
    background: rgb(255 255 255 / .18); border: 1px solid rgb(255 255 255 / .5);
    -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 6px 20px rgb(40 60 100 / .12), inset 0 1px 0 rgb(255 255 255 / .45);
    text-shadow: 0 1px 6px var(--shade);
  }
  .pill:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .nogl { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 2em; }
  .phone.no-webgl .nogl { display: grid; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="gl"></canvas>
  <svg class="dial" id="dial">
    <defs><filter id="ring-glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter></defs>
    <circle class="ring-glow" id="ringGlow"></circle>
    <circle class="ring" id="ringLine"></circle>
    <g id="ticks"></g><g id="labels"></g>
  </svg>
  <div class="tags" id="tags"></div>

  <header class="top">
    <div class="brand">Daily Rhythm</div>
    <div class="readout" id="readout">10:00 · Focus</div>
  </header>
  <footer class="foot">
    <button class="pill" id="play" type="button">暂停</button>
  </footer>
  <div class="nogl">这个原型需要 WebGL</div>
</div>

  { name: 'Stress',     icon: '<path d="M2 12h4l2.5-6 4 12 2.5-6H22"/>' },
  { name: 'Burnout',    icon: '<g transform="rotate(-40 12 12)"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5"/><path d="M12 8.5v7"/></g>' },
  { name: 'Calm',       icon: '<circle cx="12" cy="5" r="2"/><path d="M12 8.5v4.5"/><path d="M6 11l6 2 6-2"/><path d="M4.5 19.5c2-3 4.7-4.2 7.5-4.2s5.5 1.2 7.5 4.2"/><path d="M7.5 19.5h9"/>' },
];
const N = MODES.length;
const MAXP = 12;
const HOURS = 24;
const HPP = HOURS / N;               // 每片花瓣 3 小时
const HOUR_DEG = 360 / HOURS;        // 15°
const PETAL_DEG = 360 / N;           // 45°：N 片正好拼满一整圈
const POINTER = 180;                 // 选中位：9 点钟方向（与参考视频一致）
const STEP_INTERVAL = 0.83;          // 视频实测：每 0.83s 走一格

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const phone = $('phone'), canvas = $('gl'), tagsEl = $('tags'), dialEl = $('dial');
const ticksG = $('ticks'), labelsG = $('labels');

const wrap = (x, n) => ((x % n) + n * 1.5) % n - n / 2;   // → [-n/2, n/2)
const mod = (x, n) => ((x % n) + n) % n;
const pad = h => String(h).padStart(2, '0');
const rad = d => d * Math.PI / 180;

function svg(tag, attrs = {}, parent) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

// ======================= WebGL：背景 + 磨砂玻璃 =======================
const VERT = `
attribute vec2 a;
varying vec2 vUv;
void main() { vUv = a * 0.5 + 0.5; gl_Position = vec4(a, 0.0, 1.0); }`;

const COMMON = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uBg;
uniform vec4 uCover;    // 背景 cover 映射：xy 缩放，zw 偏移
vec3 bgAt(vec2 s) {     // s：屏幕坐标 0..1，左上为原点
  vec2 i = 0.5 + (s - 0.5) * uCover.xy + uCover.zw;
  vec3 c = texture2D(uBg, vec2(i.x, 1.0 - i.y)).rgb;
  // 调色：轻微压一点中间调、偏冷灰蓝；背景本身明暗对比已经够强
  return pow(c, vec3(1.08, 1.06, 1.02)) * vec3(0.99, 1.0, 1.02);
}`;

// 把背景按 cover 方式画进低分辨率缓冲，供模糊用
const COVER_FRAG = COMMON + `
uniform vec2 uRes;
void main() {
  vec2 s = vec2(gl_FragCoord.x / uRes.x, 1.0 - gl_FragCoord.y / uRes.y);
  gl_FragColor = vec4(bgAt(s), 1.0);
}`;

const BLUR_FRAG = `
precision mediump float;
uniform sampler2D uTex;
uniform vec2 uDir;      // 一个纹素 * 方向
varying vec2 vUv;
void main() {
  vec3 c = texture2D(uTex, vUv).rgb * 0.2270270;
  c += texture2D(uTex, vUv + uDir * 1.3846154).rgb * 0.3162162;
  c += texture2D(uTex, vUv - uDir * 1.3846154).rgb * 0.3162162;
  c += texture2D(uTex, vUv + uDir * 3.2307692).rgb * 0.0702703;
  c += texture2D(uTex, vUv - uDir * 3.2307692).rgb * 0.0702703;
  gl_FragColor = vec4(c, 1.0);
}`;

const MAIN_FRAG = COMMON + `
#define MAXP ${MAXP}
uniform sampler2D uBlur;
uniform vec2 uSize;       // CSS 像素
uniform float uDpr;
uniform vec2 uC;          // 轮心
uniform int uN;
uniform vec4 uP[MAXP];    // 角度(弧度), 外移(px), 选中程度 t, 缩放
uniform vec4 uShapeA;     // 内沿半径, 外沿半径, 半缝宽, 外沿鼓起半径
uniform vec4 uShapeB;     // 内角圆角, 外角圆角, sinβ, cosβ（β = 半个扇角）
uniform vec3 uGlass;      // 圆边宽度, 边缘折射位移, 透镜缩放（>1 时玻璃里看到的是更大一片背景）
uniform float uRc;        // 花瓣中心所在半径
uniform vec4 uShadow;     // 投影偏移, 投影柔化, 投影强度, 选中光晕半径

vec3 blurAt(vec2 p) { vec2 s = p / uSize; return texture2D(uBlur, vec2(s.x, 1.0 - s.y)).rgb; }

float smax(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return max(a, b) + h * h * k * 0.25;
}

// 一片花瓣的有向距离场：两条径向边（和相邻花瓣紧贴，不重叠）、
// 微鼓的外沿、截掉并倒圆的内端。N 片排满一整圈。
float pick(vec2 p, vec4 P) {
  vec2 q = p - uC;
  float ca = cos(P.x), sa = sin(P.x);
  q = vec2(q.x * ca + q.y * sa, -q.x * sa + q.y * ca);   // 转到花瓣自身坐标，+x 朝外
  q.x -= P.y;                                            // 选中时沿径向外移，不会压到邻居
  float d1 = dot(q, vec2(-uShapeB.z,  uShapeB.w)) + uShapeA.z;
  float d2 = dot(q, vec2(-uShapeB.z, -uShapeB.w)) + uShapeA.z;
  float d3 = length(q - vec2(uShapeA.y - uShapeA.w, 0.0)) - uShapeA.w;
  float d4 = uShapeA.x - length(q);
  float d = smax(d1, d2, uShapeB.x);
  d = smax(d, d4, uShapeB.x);
  return smax(d, d3, uShapeB.y);
}

// 把花瓣当成一块边缘圆润的厚玻璃：中间通透，立体感来自边缘的折射和散射，不靠迎光背光的明暗。
// 光线在凸起的圆边上向内偏折，越靠边看到的背景越靠里；
// 位移量超过圆边宽度时，边上的内容会翻折，形成贴着花瓣轮廓的弧线。
vec3 glass(vec2 p, vec4 P, float d, vec2 g) {
  float t = P.z;
  float D = max(-d, 0.0);                                // 到花瓣边缘的距离
  float u = 1.0 - clamp(D / uGlass.x, 0.0, 1.0);         // 1 = 最外沿，0 = 进入中间
  vec2 bend = -g * u * u * (3.0 - 2.0 * u);              // g 朝外，折射朝内；越靠边越强
  vec2 ctr = uC + vec2(cos(P.x), sin(P.x)) * uRc;
  vec2 sp = ctr + (p - ctr) * uGlass.z + bend * uGlass.y, cd = bend * 5.0;
  vec3 c = vec3(blurAt(sp + cd).r, blurAt(sp).g, blurAt(sp - cd).b);   // 重度模糊的背景，带一点色散
  // 白雾集中在边缘：未选中几乎不加，选中时边缘乳白、中心仍然透出背景
  float s = uShapeA.y * 0.09;
  float band = exp(-0.5 * D * D / (s * s));
  c = mix(c, vec3(1.0), 0.015 + 0.03 * t + band * mix(0.03, 0.55, t));
  c *= mix(vec3(0.985, 0.99, 1.0), vec3(1.0), t);        // 未选中只带一点冷调，颜色主要来自背后的背景
  // 四周一致的发丝亮线。不分迎光背光，否则会像浮雕的实心块
  c += exp(-abs(d + 0.5) / 0.45) * (0.055 + 0.02 * t);
  return c;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uSize.y * uDpr - gl_FragCoord.y) / uDpr;
  vec3 col = mix(bgAt(p / uSize), blurAt(p), 0.15);

  float sh = 0.0, glow = 0.0;
  for (int i = 0; i < MAXP; i++) {
    if (i >= uN) break;
    float ds = pick(p - vec2(0.4, 1.0) * uShadow.x, uP[i]);   // 光从左上来，影子落在右下
    sh = max(sh, 1.0 - smoothstep(-uShadow.y, uShadow.y, ds));
    float dg = pick(p, uP[i]);
    glow = max(glow, uP[i].z * (1.0 - smoothstep(0.0, uShadow.w, dg)));
  }
  col *= 1.0 - uShadow.z * sh;
  col += glow * 0.08;

  for (int i = 0; i < MAXP; i++) {
    if (i >= uN) break;
    vec4 P = uP[i];
    float d = pick(p, P);
    if (d > 1.0) continue;
    vec2 e = vec2(0.6, 0.0);
    vec2 g = vec2(pick(p + e.xy, P) - pick(p - e.xy, P), pick(p + e.yx, P) - pick(p - e.yx, P));
    g /= max(length(g), 1e-4);
    float a = 1.0 - smoothstep(-0.75, 0.75, d);
    col = mix(col, glass(p, P, d, g), a);
  }
  // 背景很平滑，8 位色深下暗部容易出现色带；叠加约一级亮度的抖动把它打散，肉眼看不到颗粒
  float dither = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  gl_FragColor = vec4(col + (dither - 0.5) * 2.0 / 255.0, 1.0);
}`;

const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false });
let GLX = null;

function initGL() {
  if (!gl) { phone.classList.add('no-webgl'); return; }
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = frag => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
    gl.bindAttribLocation(p, 0, 'a');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  };
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  GLX = {
    cover: program(COVER_FRAG), blur: program(BLUR_FRAG), main: program(MAIN_FRAG),
    bg: gl.createTexture(), bgSize: [1, 1], fbo: [],
  };
  // 图片加载前先用一张渐变占位
  const ph = document.createElement('canvas');
  ph.width = 90; ph.height = 160;
  const c2 = ph.getContext('2d'), lg = c2.createLinearGradient(0, 0, 0, 160);
  lg.addColorStop(0, '#e6ecf3'); lg.addColorStop(.5, '#bccadb'); lg.addColorStop(1, '#8ea2bd');
  c2.fillStyle = lg; c2.fillRect(0, 0, 90, 160);
  uploadBg(ph);
  const img = new Image();
  img.onload = () => uploadBg(img);
  img.src = BG_IMAGE;               // 背景内嵌在页面里，直接打开文件或在预览里打开也能显示
}

function texParams() {
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
function uploadBg(src) {
  gl.bindTexture(gl.TEXTURE_2D, GLX.bg);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  texParams();
  GLX.bgSize = [src.naturalWidth || src.width, src.naturalHeight || src.height];
}
function makeFbo(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  texParams();
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { fb, tex, w, h };
}

function sizeGL() {
  if (!GLX) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(G.W * dpr);
  canvas.height = Math.round(G.H * dpr);
  G.dpr = canvas.width / G.W;
  GLX.fbo.forEach(f => { gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); });
  const bw = Math.ceil(G.W / 5), bh = Math.ceil(G.H / 5);   // 1/5 分辨率模糊，便宜又够糊
  GLX.fbo = [makeFbo(bw, bh), makeFbo(bw, bh)];
}

// 背景取景：让深色和暖色的交界穿过选中位置的花瓣，玻璃内部才有明暗过渡。背景图外圈的压暗也是按这个取景做的。
const BG_FRAME = { zoom: 0.86, x: 0.05, y: -0.05 };

function coverUniform(time) {
  const ca = G.W / G.H, ia = GLX.bgSize[0] / GLX.bgSize[1];
  const breathe = reduceMotion ? 1 : 1 - 0.018 * (1 + Math.sin(time * 0.09));
  const fx = Math.min(1, ca / ia), fy = Math.min(1, ia / ca), z = BG_FRAME.zoom;
  // 平移量不能超出图片余量，否则屏幕较宽时边缘像素会被拉成条纹（0.006 / 0.008 留给下面的缓慢漂移）
  const mx = Math.max(0, (1 - fx * z) / 2 - 0.006), my = Math.max(0, (1 - fy * z) / 2 - 0.008);
  const ox = Math.max(-mx, Math.min(mx, BG_FRAME.x)), oy = Math.max(-my, Math.min(my, BG_FRAME.y));
  return [fx * z * breathe, fy * z * breathe,
          ox + (reduceMotion ? 0 : Math.sin(time * 0.07) * 0.006),
          oy + (reduceMotion ? 0 : Math.cos(time * 0.05) * 0.008)];
}

function drawGL(time, pickState) {
  if (!GLX) return;
  const cov = coverUniform(time);
  const [A, B] = GLX.fbo;
  // 1) 背景缩小画进缓冲  2) 来回做几轮高斯模糊
  gl.useProgram(GLX.cover.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, A.fb);
  gl.viewport(0, 0, A.w, A.h);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, GLX.bg);
  gl.uniform1i(GLX.cover.u.uBg, 0);
  gl.uniform4fv(GLX.cover.u.uCover, cov);
  gl.uniform2f(GLX.cover.u.uRes, A.w, A.h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.useProgram(GLX.blur.p);
  gl.uniform1i(GLX.blur.u.uTex, 0);
  for (let i = 0; i < 3; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, B.fb); gl.bindTexture(gl.TEXTURE_2D, A.tex);
    gl.uniform2f(GLX.blur.u.uDir, 1 / A.w, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, A.fb); gl.bindTexture(gl.TEXTURE_2D, B.tex);
    gl.uniform2f(GLX.blur.u.uDir, 0, 1 / A.h); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  // 3) 主画面：背景 + 投影 + 玻璃花瓣
  const m = GLX.main;
  gl.useProgram(m.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, GLX.bg);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, A.tex);
  gl.uniform1i(m.u.uBg, 0);
  gl.uniform1i(m.u.uBlur, 1);
  gl.uniform4fv(m.u.uCover, cov);
  gl.uniform2f(m.u.uSize, G.W, G.H);
  gl.uniform1f(m.u.uDpr, G.dpr);
  gl.uniform2f(m.u.uC, G.cx, G.cy);
  gl.uniform1i(m.u.uN, pickState.length);
  const arr = new Float32Array(MAXP * 4);
  pickState.forEach((s, i) => arr.set([rad(s.psi), G.pop * s.e, s.e, s.scale], i * 4));
  gl.uniform4fv(m.u.uP, arr);
  const b = Math.PI / N;
  gl.uniform4f(m.u.uShapeA, G.r0, G.r1, G.gap / 2, G.rb);
  gl.uniform4f(m.u.uShapeB, G.kIn, G.kOut, Math.sin(b), Math.cos(b));
  gl.uniform3f(m.u.uGlass, G.bevel, G.refract, 1.2);
  gl.uniform1f(m.u.uRc, G.rp);
  gl.uniform4f(m.u.uShadow, G.U * 0.018, G.U * 0.04, 0.08, G.U * 0.05);   // 很淡的投影：玻璃透光，影子重了会像实心块
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.activeTexture(gl.TEXTURE0);
}

// ======================= 几何 / DOM =======================
let G = {}, tags = [], labels = [];

function build() {
  const W = phone.clientWidth, H = phone.clientHeight;
  if (!W || !H) return;
  const U = Math.min(W, H / 2.1);   // 矮屏时整体缩小
  G = {
    W, H, U,
    cx: W - U * 0.02, cy: H * 0.5,    // 轮心贴着屏幕右边缘：只露出大约一半，上下滑动转动
    rLine: U * 0.56,                  // 环线
    tick: U * 0.035,
    rLabel: U * 0.665,
    r0: U * 0.13,                     // 花瓣内端（圆润的截头，参考图尖端离轮心 ≈0.127W）
    r1: U * 0.42,                     // 花瓣外沿（参考图 ≈0.35~0.38W，半圈展示时略放大）
    gap: 0,                           // 相邻花瓣紧贴，中段没有缝，只有内外两端的圆角形成 V 形缺口
    kIn: U * 0.05, kOut: U * 0.06,    // 内端 / 外角圆角：大倒角，同参考图
    bevel: U * 0.084, refract: U * 0.15,   // 圆边宽度、边缘折射位移（约为外半径的 0.2 和 0.36）
    pop: 0,                           // 选中不外移，保持紧贴；靠亮度和光晕区分
  };
  G.rb = G.r1 * 0.8;                  // 外沿微微鼓起
  G.rp = G.r0 + (G.r1 - G.r0) * 0.56; // 图标和文字所在半径
  phone.style.setProperty('--W', U + 'px');

  // 花瓣上的图标 + 文字（正立，不跟着转）
  tagsEl.textContent = '';
  tags = MODES.map(m => {
    const el = document.createElement('div');
    el.className = 'tag';
    el.innerHTML = `<svg viewBox="0 0 24 24">${m.icon}</svg><span>${m.name}</span>`;
    tagsEl.appendChild(el);
    return el;
  });

  // 环线 + 刻度：每 15 分钟一根，整点长一些，整点外侧是时间文字
  dialEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  for (const id of ['ringLine', 'ringGlow']) {
    const c = $(id);
    c.setAttribute('cx', G.cx); c.setAttribute('cy', G.cy); c.setAttribute('r', G.rLine);
  }
  ticksG.textContent = ''; labelsG.textContent = '';
  for (let q = 0; q < HOURS * 4; q++) {
    const a = rad(POINTER + q * HOUR_DEG / 4);
    const len = q % 4 === 0 ? G.tick : q % 2 === 0 ? G.tick * .55 : G.tick * .32;
    svg('line', {
      x1: G.cx + G.rLine * Math.cos(a), y1: G.cy + G.rLine * Math.sin(a),
      x2: G.cx + (G.rLine + len) * Math.cos(a), y2: G.cy + (G.rLine + len) * Math.sin(a),
      'stroke-width': q % 4 === 0 ? 1.5 : 1.1, 'stroke-opacity': q % 4 === 0 ? 1 : q % 2 === 0 ? .7 : .5,
    }, ticksG);
  }
  labels = Array.from({ length: HOURS }, (_, h) => {
    const t = svg('text', {}, labelsG);
    t.textContent = `${pad(h)}:00`;
    return t;
  });
  // 越往上下两端越淡（遮罩固定在屏幕上，表盘在下面转）
  const mask = `conic-gradient(from 270deg at ${G.cx}px ${G.cy}px, #000 0deg, rgb(0 0 0 / .92) 14deg,
    rgb(0 0 0 / .55) 40deg, rgb(0 0 0 / .3) 70deg, rgb(0 0 0 / .2) 95deg, rgb(0 0 0 / .2) 265deg,
    rgb(0 0 0 / .3) 290deg, rgb(0 0 0 / .55) 320deg, rgb(0 0 0 / .92) 346deg, #000 360deg)`;
  dialEl.style.maskImage = dialEl.style.webkitMaskImage = mask;

  sizeGL();
  shownHour = null;
}

// ======================= 音效 =======================
// 声音全部用代码合成，不依赖音频文件，所以直接打开文件或在预览里打开也能发声。
// 浏览器要求用户操作之后才能出声，所以第一次点按时才启动音频。
const SFX = (() => {
  // 玻璃的振动模态：[频率比, 音量, 衰减到 -60dB 的时间（秒）]
  const GLASS = [[1, 1, .62], [1.007, .28, .44], [2.32, .26, .22], [4.25, .08, .1], [6.63, .03, .05]];
  const MUTED = [[1, 1, .26], [2.32, .14, .09], [4.25, .03, .04]];
  const CLICK = [[1, 1, .024], [1.71, .42, .016], [3.1, .16, .009]];
  // 8 片花瓣沿一圈走 D 大调五声音阶：相邻两片只差一级，转完一圈正好接回起点
  const SCALE = [587.33, 659.25, 739.99, 880, 987.77];
  const PETAL_NOTE = [0, 1, 2, 3, 4, 3, 2, 1];
  const LOW = 493.88, HIGH = 659.25;       // 暂停、播放用的两个音
  let ctx = null, dry, wet, bank, lastTick = 0, seed = 1;
  const rand = () => (seed = seed * 16807 % 2147483647) / 2147483647;

  function normalize(x) {
    let peak = 0;
    for (const v of x) peak = Math.max(peak, Math.abs(v));
    for (let i = 0; i < x.length; i++) x[i] /= peak;
    return x;
  }
  function strike(sr, f0, len, modes, body, contact) {
    const n = Math.ceil(sr * len), x = new Float32Array(n);
    const add = (f, a, t60) => {
      const w = 2 * Math.PI * f / sr, k = Math.pow(.001, 1 / (t60 * sr));
      let e = a;
      for (let i = 0; i < n && e > 1e-5; i++, e *= k) x[i] += e * Math.sin(w * i);
    };
    for (const [r, a, t] of modes) add(f0 * r, a, t);
    if (body) add(f0 / 2, body, .1);       // 低八度、很快消失的一下，让玻璃听起来更厚
    let lp = 0;                            // 接触瞬间的一点噪声，是“碰到东西”的感觉
    for (let i = 0, m = sr * .004 | 0; i < m; i++) {
      lp += .35 * (rand() * 2 - 1 - lp);
      x[i] += contact * lp * (1 - i / m);
    }
    const fadeIn = sr * .0015 | 0, fadeOut = sr * .008 | 0;   // 首尾淡入淡出，防止爆音
    for (let i = 0; i < fadeIn; i++) x[i] *= i / fadeIn;
    for (let i = 0; i < fadeOut; i++) x[n - 1 - i] *= i / fadeOut;
    return normalize(x);
  }
  function layer(sr, len, parts) {         // parts：[波形, 起始秒数, 音量]
    const x = new Float32Array(sr * len | 0);
    for (const [src, at, gain] of parts) {
      const o = sr * at | 0;
      for (let i = 0; i < src.length && o + i < x.length; i++) x[o + i] += src[i] * gain;
    }
    return normalize(x);
  }

  function build() {
    const sr = ctx.sampleRate;
    const buf = x => { const b = ctx.createBuffer(1, x.length, sr); b.getChannelData(0).set(x); return b; };
    const soft = f => strike(sr, f, .32, MUTED, .22, .1);
    bank = {
      notes: SCALE.map(f => buf(strike(sr, f, .75, GLASS, .3, .14))),
      muted: buf(soft(SCALE[0])),
      tick: buf(strike(sr, 2300, .05, CLICK, 0, .3)),
      pause: buf(layer(sr, .42, [[soft(HIGH), 0, .85], [soft(LOW), .065, 1]])),
      play: buf(layer(sr, .42, [[soft(LOW), 0, .85], [soft(HIGH), .065, 1]])),
    };
    dry = ctx.createGain();
    dry.gain.value = .32;
    dry.connect(ctx.destination);
    // 很短的混响，让声音有一点空间，不是干巴巴的电子音
    const len = sr * .55 | 0, ir = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      let lp = 0;
      for (let i = 0; i < len; i++) { lp += .25 * (rand() * 2 - 1 - lp); d[i] = lp * Math.pow(.001, i / len); }
    }
    wet = ctx.createConvolver();
    wet.buffer = ir;
    wet.connect(dry);
  }
  function unlock(e) {
    if (e.type === 'pointerdown' && e.pointerType !== 'mouse') return;   // 触屏要等抬手才算用户操作
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC({ latencyHint: 'interactive' });
      build();
    }
    if (ctx.state !== 'running') ctx.resume();
  }
  for (const t of ['pointerdown', 'pointerup', 'keydown']) addEventListener(t, unlock, true);

  function play(buffer, gain, rate, send) {
    if (ctx.state !== 'running') ctx.resume();   // 切到后台再回来时，音频可能被挂起
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = buffer;
    s.playbackRate.value = rate;
    g.gain.value = gain;
    s.connect(g);
    g.connect(dry);
    if (send) { const w = ctx.createGain(); w.gain.value = send; g.connect(w); w.connect(wet); }
    s.start();
  }
  const whenReady = f => (...args) => { if (ctx) f(...args); };
  return {
    tick: whenReady(() => {                      // 转过一小时：很轻的一下，音高略有随机，避免机械感
      const t = performance.now();
      if (t - lastTick < 40) return;
      lastTick = t;
      play(bank.tick, .3, .96 + rand() * .08, 0);
    }),
    petal: whenReady((k, soft) => play(bank.notes[PETAL_NOTE[k]], soft ? .62 : 1, 1, soft ? .14 : .2)),   // 切换到另一片花瓣
    same: whenReady(k => play(bank.muted, .5, SCALE[PETAL_NOTE[k]] / SCALE[0], .1)),                      // 点已选中的花瓣
    toggle: whenReady(on => play(on ? bank.play : bank.pause, .7, 1, .15)),                               // 播放上行，暂停下行
  };
})();

// ======================= 状态 & 弹簧 =======================
const dial = { x: 10, v: 0 };                      // 连续的"小时"位置
const ring = { x: Math.floor(10 / HPP), v: 0 };    // 连续的"花瓣"位置
let hourTarget = 10;
let auto = !reduceMotion, autoAcc = 0, lastInput = -1e9;
let drag = null, wheelAcc = 0, shownHour = null;

function stepSpring(s, target, k, zeta, dt) {
  const c = 2 * Math.sqrt(k) * zeta, n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (let i = 0; i < n; i++) { s.v += (k * (target - s.x) - c * s.v) * h; s.x += s.v * h; }
}

function render(time) {
  if (!G.W) return;
  const { cx, cy } = G;

  // 表盘
  ticksG.setAttribute('transform', `rotate(${-dial.x * HOUR_DEG} ${cx} ${cy})`);
  labels.forEach((el, h) => {
    const d = wrap(h - dial.x, HOURS);
    const psi = POINTER + d * HOUR_DEG, a = rad(psi);
    let rot = mod(psi + 360, 360) - 180;                     // 径向排布，读向圆心
    if (rot > 90) rot -= 180; else if (rot < -90) rot += 180; // 右半圈翻正
    const t = Math.max(0, 1 - Math.abs(d));
    el.setAttribute('transform',
      `translate(${(cx + G.rLabel * Math.cos(a)).toFixed(2)} ${(cy + G.rLabel * Math.sin(a)).toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${1 + .2 * t})`);
    el.style.opacity = .62 + .38 * t;
    el.classList.toggle('on', t > .5);
  });

  // 花瓣
  const state = MODES.map((_, k) => {
    const d = wrap(k - ring.x, N);
    const t = Math.max(0, 1 - Math.abs(d)), e = t * t * (3 - 2 * t);
    return { k, d, psi: POINTER + d * PETAL_DEG, e, scale: 1 };
  });
  state.forEach(s => {
    const a = rad(s.psi), r = G.rp + G.pop * s.e, el = tags[s.k];
    el.style.transform = `translate(${cx + r * Math.cos(a)}px, ${cy + r * Math.sin(a)}px) translate(-50%, -50%) scale(${s.scale})`;
    el.style.setProperty('--t', s.e.toFixed(3));
    el.style.opacity = 1 - Math.min(1, Math.max(0, (Math.abs(s.d) - 1.5) / .5));   // 贴到屏幕右边、只露一半的花瓣，字先淡掉
    el.classList.toggle('on', s.e > .5);
  });
  state.sort((a, b) => a.e - b.e || Math.abs(b.d) - Math.abs(a.d));   // 离选中位越近越靠上
  drawGL(time, state);

  const h = mod(Math.round(dial.x), HOURS);
  if (h !== shownHour) {
    if (shownHour !== null && drag) navigator.vibrate?.(4);
    shownHour = h;
    const k = Math.floor(h / HPP);
    const el = $('readout');
    el.textContent = `${pad(h)}:00 · ${MODES[k].name} · ${pad(k * HPP)}–${pad((k + 1) * HPP % HOURS)}`;
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  }
}

// 转动的声音：每过一小时一声轻响，跨到另一片花瓣时换成玻璃音。自动播放时不发声。
let soundHour = null, soundMuteUntil = 0;
function soundForMotion(now) {
  if (soundHour === null) soundHour = Math.round(dial.x);
  if (Math.abs(dial.x - soundHour) < .58) return;       // 留一点回差，手指停在两格之间抖动时不会连响
  const modeOf = x => Math.floor(mod(x, HOURS) / HPP);
  const next = Math.round(dial.x), from = modeOf(soundHour), to = modeOf(next);
  soundHour = next;
  if ((!drag && now - lastInput > 2600) || now < soundMuteUntil) return;
  if (to !== from) SFX.petal(to, true); else SFX.tick();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (auto && !drag && now - lastInput > 2600) {
    autoAcc += dt;
    if (autoAcc >= STEP_INTERVAL) { autoAcc -= STEP_INTERVAL; hourTarget = Math.round(hourTarget) + 1; }
  } else autoAcc = 0;
  if (!drag) stepSpring(dial, hourTarget, 600, reduceMotion ? 1 : .72, dt);
  if (drag) {
    // 拖动时花瓣和刻度一起跟手转（同样的角速度），选中段的中间那个小时对准指针
    ring.x = (dial.x - (HPP - 1) / 2) / HPP; ring.v = 0;
  } else {
    // 松手 / 自动播放：齿轮联动，表盘过了某段的边界，花瓣才跳到下一片
    stepSpring(ring, Math.floor(Math.round(dial.x) / HPP), 360, reduceMotion ? 1 : .64, dt);
  }
  render(now / 1000);
  soundForMotion(now);
  requestAnimationFrame(frame);
}

// ======================= 交互 =======================
function local(e) {
  const r = phone.getBoundingClientRect();
  const x = e.clientX - r.left - G.cx, y = e.clientY - r.top - G.cy;
  return { x, y, dist: Math.hypot(x, y), ang: Math.atan2(y, x) * 180 / Math.PI };
}
function nudge(delta) {
  lastInput = performance.now();
  hourTarget = Math.round(hourTarget) + delta;
  hourTarget = Math.max(Math.round(dial.x) - 4, Math.min(Math.round(dial.x) + 4, hourTarget));
}

phone.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  try { phone.setPointerCapture(e.pointerId); } catch {}
  phone.classList.add('dragging');
  drag = { start: dial.x, moved: 0, x0: e.clientX, y0: e.clientY, samples: [[performance.now(), dial.x]] };
  dial.v = 0;
  lastInput = performance.now();
});
phone.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0));
  if (drag.moved < 4) return;
  // 上下滑动：手指往下拖，轮盘左侧跟着往下走（上面的时间转到指针处）；按环线处的弧长换算
  dial.x = drag.start + (e.clientY - drag.y0) / (G.rLine * rad(HOUR_DEG));
  const now = performance.now();
  drag.samples.push([now, dial.x]);
  while (drag.samples.length > 2 && now - drag.samples[0][0] > 90) drag.samples.shift();
});
function endDrag(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  phone.classList.remove('dragging');
  lastInput = performance.now();
  if (d.moved < 6) {                                     // 视作点按
    const p = local(e), off = wrap(p.ang - POINTER, 360);
    if (p.dist > G.r0 && p.dist < G.r1 + G.pop) {       // 点在花瓣上
      const kU = Math.round(ring.x + off / PETAL_DEG);
      if (kU !== Math.floor(Math.round(dial.x) / HPP)) {
        hourTarget = kU * HPP;
        SFX.petal(mod(kU, N));
        soundMuteUntil = performance.now() + 450;       // 这一声已经代表这次切换，转动过程不再叠加
      } else SFX.same(mod(kU, N));
    } else if (p.dist >= G.r1 + G.pop) {                // 点在刻度上
      hourTarget = Math.round(dial.x + off / HOUR_DEG);
      if (hourTarget === Math.round(dial.x)) SFX.tick();
    }
    return;
  }
  const clamp = (x, m) => Math.max(-m, Math.min(m, x));
  const [t0, x0] = d.samples[0], [t1, x1] = d.samples[d.samples.length - 1];
  const still = performance.now() - t1 > 80;              // 停住后再松手，不算甩动
  const v = still ? 0 : clamp(t1 > t0 ? (x1 - x0) / ((t1 - t0) / 1000) : 0, 30);
  dial.v = v;
  hourTarget = Math.round(dial.x + clamp(v * .14, HPP));  // 按甩动速度预估落点，最多多转一片花瓣
}
phone.addEventListener('pointerup', endDrag);
phone.addEventListener('pointercancel', endDrag);

phone.addEventListener('wheel', e => {
  e.preventDefault();
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 40) { nudge(-Math.sign(wheelAcc)); wheelAcc = 0; }   // 和手指滑动方向一致
}, { passive: false });

addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { nudge(1); e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { nudge(-1); e.preventDefault(); }
  if (e.key === ' ') { togglePlay(); e.preventDefault(); }
});

function togglePlay() {
  auto = !auto;
  SFX.toggle(auto);
  $('play').textContent = auto ? '暂停' : '自动播放';
  lastInput = -1e9;
}
$('play').addEventListener('click', togglePlay);
if (!auto) $('play').textContent = '自动播放';

try { initGL(); } catch (err) { console.error(err); phone.classList.add('no-webgl'); GLX = null; }
new ResizeObserver(build).observe(phone);
document.fonts?.ready.then(build);
requestAnimationFrame(frame);
</script>
</body>
</html>
